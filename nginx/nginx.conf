events {
    worker_connections 1024;
}

http {
    # Định nghĩa các nhóm server (Upstream)
    # Tên server phải trùng với tên service trong docker-compose
    
    upstream frontend {
        server web:80;
    }

    upstream ingestion_service {
        server ingestion:8000;
    }

    upstream analysis_service {
        server analysis:8001; 
    }

    upstream prediction_service {
        server prediction:8002;
    }

    upstream clustering_service {
        server clustering:8003;
    }

    upstream api_db_service {
        server api-database:8004;
    }

    server {
        listen 80;

        # 1. Routing cho API Ingestion
        location /api/ingest/ {
            proxy_pass http://ingestion_service/;
            rewrite ^/api/ingest/(.*)$ /$1 break; # Cắt bỏ prefix /api/ingest khi chuyển vào backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Routing cho API Analysis
        location /api/analysis/ {
            proxy_pass http://analysis_service/;
            rewrite ^/api/analysis/(.*)$ /$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Routing cho API Prediction
        location /api/predict/ {
            proxy_pass http://prediction_service/;
            rewrite ^/api/predict/(.*)$ /$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Routing cho API Clustering
        location /api/cluster/ {
            proxy_pass http://clustering_service/;
            rewrite ^/api/cluster/(.*)$ /$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Routing cho API Database
        location /api/db/ {
            proxy_pass http://api_db_service/;
            rewrite ^/api/db/(.*)$ /$1 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 6. Mặc định vào Frontend (React/Vue/Angular...)
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}